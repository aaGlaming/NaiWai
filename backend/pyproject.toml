[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "I001"]
"tests/conftest.py" = ["E402"]
